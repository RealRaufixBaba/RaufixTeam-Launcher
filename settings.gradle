pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        # jitpack.io removed temporarily to diagnose hang - com.github.* deps need it
    }
}

rootProject.name='RaufixTeamLauncher'
include ':app_mojo'

include ':forge_installer'
include ':NoBlocklist'
include ':glfw:jni_bindings'
include ':mojoexec:jni_bindings'
include ':sdl:jni_bindings'
