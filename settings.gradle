pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } // com.github.* deps (caciocavallo, checkerboarddrawable, portrait-sdp/ssp, ExtendedView, android_gamepad_remapper, virtual-joystick-android, alsoft-android-aar)
    }
}

rootProject.name='RaufixTeamLauncher'
include ':app_mojo'

include ':forge_installer'
include ':NoBlocklist'
include ':glfw:jni_bindings'
include ':mojoexec:jni_bindings'
include ':sdl:jni_bindings'
