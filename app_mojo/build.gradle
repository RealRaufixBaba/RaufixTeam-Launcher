plugins {
    id 'com.android.application' version '8.11.1'
    id 'de.undercouch.download' version '5.6.0'
}

import de.undercouch.gradle.tasks.download.Download

static def getDate() { return new Date().format('yyyyMMdd') }

/**
 * Monotonic, reproducible versionCode for 1.0.0.
 * Spec: "Keep versionCode monotonic and reproducible; do not invent a date-based version."
 * Starts at 1000001 (major 1, minor 0, patch 0, build 1). Bump the last digit for each release.
 */
static def getVersionCode() { return 1000001 }

def getVersionName = {
    return "1.0.0"
}

// CurseForge API key removed from the build.
// RFX-153: Never put CurseForge secret in client APK.
// No CURSEFORGE_API_KEY env read, no curseforge_key.txt, no resValue.
// Live official CurseForge access must go through an owner-operated HTTPS gateway
// with server-side secret management; the client receives only the gateway URL.

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

android {
    namespace 'git.raufixteam.launcher'

    compileSdk = 36

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
        unitTests.returnDefaultValues = true
    }

    def releaseKeystorePath = System.getenv("RAUFIXTEAM_KEYSTORE_PATH")
    def releaseKeystorePassword = System.getenv("RAUFIXTEAM_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("RAUFIXTEAM_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("RAUFIXTEAM_KEY_PASSWORD")
    def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.isEmpty() &&
            new File(releaseKeystorePath).isFile() &&
            releaseKeystorePassword != null && !releaseKeystorePassword.isEmpty() &&
            releaseKeyAlias != null && !releaseKeyAlias.isEmpty()

    signingConfigs {
        raufixRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword (releaseKeyPassword != null && !releaseKeyPassword.isEmpty() ? releaseKeyPassword : releaseKeystorePassword)
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    defaultConfig {
        applicationId "com.raufixteam.launcher"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode getVersionCode()
        versionName getVersionName()
        multiDexEnabled true
        // No curseforge_api_key resValue — secret must not ship in the APK.
        resValue 'string', 'group_id', 'com.raufixteam'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }

    flavorDimensions  = ["runtime"]

    productFlavors {
        full {
            dimension "runtime"
        }

        noruntime {
            dimension "runtime"
            versionNameSuffix "-noruntime"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'application_package', 'com.raufixteam.launcher.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.raufixteam.launcher.debug.scoped.gamefolder'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
            matchingFallbacks += List.of("debug")
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.raufixRelease
            }
            ndk {
                debugSymbolLevel 'NONE'
            }
            resValue 'string', 'storageProviderAuthorities', 'com.raufixteam.launcher.scoped.gamefolder'
            resValue 'string', 'application_package', 'com.raufixteam.launcher'
        }
        gplay {
            initWith release
            matchingFallbacks += List.of("release")
        }
        pubRelease {
            initWith release
            matchingFallbacks += List.of("release")
        }
    }

    ndkVersion "29.0.14206865"

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    androidResources {
        noCompress 'gif', 'mp4'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
    }

    buildFeatures {
        buildConfig true
    }
}

class AssetTaskRegistrar {
    private Project project
    private Task mergeAssetsTask
    private File targetAssetsDir
    private String variantName
    private File targetDownloadDir
    private File projectJarDir

    AssetTaskRegistrar(Project project) {
        this.project = project

        targetDownloadDir = new File(project.projectDir, "build/intermediates/download_deps")
        projectJarDir = new File(project.projectDir, "build/intermediates/package_jar_deps")
        createDirectories targetDownloadDir
        createDirectories projectJarDir
    }

    def setVariant(variant) {
        def flavorName = variant.productFlavors.empty ? "" : variant.productFlavors[0].name.toString()
        def buildTypeName = variant.buildType.name.toString().capitalize()
        def variantNameRaw = (flavorName + buildTypeName)
        variantName = variantNameRaw.capitalize()
        mergeAssetsTask = project.tasks.named("pre${variantName}Build").get()

        targetAssetsDir = new File(project.projectDir, "build/intermediates/remote_asset_set/${variantNameRaw.toLowerCase()}/")
        createDirectories(targetAssetsDir)

        project.android.sourceSets[variantNameRaw].assets.srcDirs += targetAssetsDir.absolutePath
    }

    static def createDirectories(File location) {
        if(!location.isDirectory() && !location.mkdirs())
            throw new RuntimeException("Failed to create directory "+location.getAbsolutePath())
    }

    static def writeVersion(File dir) {
        File versionFile = new File(dir, "version")
        versionFile.write(String.valueOf(new Date().getTime()))
    }

    private def assetDestination(String relativePath) {
        return new File(targetAssetsDir, relativePath)
    }

    private def onlineUnzipTask(String downloadUrl, String name, File targetExtractionDir) {
        createDirectories targetExtractionDir

        def downloadTarget = new File(targetDownloadDir, name)

        def dependencySuffix = "${name}${variantName}"
        def downloadTask = project.tasks.register("download${dependencySuffix}", Download) {
            src downloadUrl
            dest downloadTarget
            overwrite false
        }

        def unzipTask = project.tasks.register("unzip${dependencySuffix}", Copy) {
            from project.zipTree(downloadTarget)
            exclude '**/bin-arm.tar.xz', '**/bin-x86.tar.xz', '**/bin-x86_64.tar.xz'
            into targetExtractionDir
            dependsOn downloadTask
        }
        return unzipTask
    }

    def onlineZipDependency(String downloadUrl, String name, String relativePath) {
        mergeAssetsTask.dependsOn(onlineUnzipTask downloadUrl, name, assetDestination(relativePath))
    }

    def projectJarDependency(Project targetProject, String relativePath) {
        def assetTargetDir = assetDestination(relativePath)
        def jarTargetDir = new File(projectJarDir, relativePath)
        createDirectories assetTargetDir
        createDirectories jarTargetDir

        def copyTaskName = "copyProjectJar${jarTargetDir.getName()}${variantName}"
        def copyTask = project.tasks.register(copyTaskName, Copy) {
            from jarTargetDir
            into assetTargetDir
            doLast {
                if(!it.didWork) return
                writeVersion jarTargetDir
            }
            dependsOn ":${targetProject.name}:assemble"
        }

        mergeAssetsTask.dependsOn copyTask

        targetProject.tasks.withType(org.gradle.jvm.tasks.Jar.class).configureEach {
            it.destinationDirectory = jarTargetDir
        }
    }

    def onlineJarDependency(String jarUrl, String jarProject, String dependency, String version, String suffix,  String relativePath) {
        File targetDir = assetDestination(relativePath)
        createDirectories targetDir
        def dependencySuffix = "${jarProject}${dependency}${variantName}"
        def downloadTask = project.tasks.register("download${dependencySuffix}", Download) {
            src String.format(jarUrl, jarProject, dependency, version, suffix)
            dest targetDir
            overwrite false
            doLast {
                if(!it.didWork) return
                writeVersion targetDir
            }
        }
        mergeAssetsTask.dependsOn(downloadTask)
    }

    def jreRuntimeDependency(int version, String relPath) {
        def jreUrl = "https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre%d-pojav.zip"
        onlineZipDependency(String.format(jreUrl, version), "ComponentRuntime$version", relPath)
    }
}

afterEvaluate {
    def registrar = new AssetTaskRegistrar(project)

    android.applicationVariants.configureEach { variant ->
        registrar.setVariant(variant)

        registrar.projectJarDependency project(":forge_installer"), "components/forge_installer"
        registrar.projectJarDependency project(":NoBlocklist"), "components/noblocklist"

        def flavorName = variant.productFlavors.empty ? "" : variant.productFlavors[0].name.toString()
        if (flavorName.toLowerCase().contains("full")) {
            registrar.jreRuntimeDependency 8, "components/jre"
        }

        def cacioJarUrl = "https://jitpack.io/com/github/MojoLauncher/%1\\$s/%2\\$s/%3\\$s/%2\\$s-%3\\$s%4\\$s.jar"

        registrar.onlineJarDependency cacioJarUrl, "caciocavallo", "cacio-shared", "d0efb5aaba", "", "components/caciocavallo"
        registrar.onlineJarDependency cacioJarUrl, "caciocavallo", "cacio-androidnw", "d0efb5aaba", "", "components/caciocavallo"

        registrar.onlineJarDependency cacioJarUrl, "caciocavallo17", "cacio-tta", "-411454b006-1", "-jar-with-dependencies", "components/caciocavallo17"
    }
}

dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.annotation:annotation:1.10.0'

    implementation "androidx.constraintlayout:constraintlayout:2.2.1"

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'

    implementation 'org.tukaani:xz:1.10'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'org.apache.commons:commons-compress:1.21'
    implementation 'net.objecthunter:exp4j:0.4.8'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.zxing:core:3.5.3'

    implementation 'com.github.MojoLauncher:alsoft-android-aar:f369161d5f'

    implementation project(":glfw:jni_bindings")
    implementation project(":sdl:jni_bindings")
    implementation project(":mojoexec:jni_bindings")

    implementation fileTree(dir: 'libs', include: ['*.aar'])

    testImplementation 'junit:junit:4.13.2'
}
