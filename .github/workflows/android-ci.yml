name: Build & Test RaufixTeam Launcher V1

on:
  push:
    branches: [ main, "arena/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: 8.14.5
  COMPILE_SDK: 36
  NDK_VERSION: 29.0.14206865
  JAVA_VERSION: 17

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          sdk-path: |
            android-sdk
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;3.22.1
          licenses: android-sdk-preview,android-sdk-license,google-gdk-license

      - name: Write local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_SDK_ROOT }}" > local.properties
          echo "ndk.dir=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}" >> local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle wrapper validation
        run: ./gradlew --version

      - name: Unit tests (Full Release)
        id: unit-test
        run: ./gradlew :app_mojo:testFullReleaseUnitTest

      - name: Lint (Full Release)
        id: lint
        run: ./gradlew :app_mojo:lintFullRelease

      - name: Assemble Full Release APK
        id: assemble
        run: ./gradlew :app_mojo:assembleFullRelease

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app_mojo/build/reports/tests/testFullReleaseUnitTest/
          retention-days: 7

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app_mojo/build/reports/lints/
          retention-days: 7

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raufixteam-launcher-full-release-apk
          path: app_mojo/build/outputs/apk/full/release/*.apk
          retention-days: 30

  sign-release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          sdk-path: |
            android-sdk
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;3.22.1
          licenses: android-sdk-preview,android-sdk-license,google-gdk-license

      - name: Write local.properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_SDK_ROOT }}" > local.properties
          echo "ndk.dir=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}" >> local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RAUFIXTEAM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "RAUFIXTEAM_KEYSTORE_PATH=$(pwd)/release.keystore" >> $GITHUB_ENV
          fi

      - name: Assemble & sign Full Release
        env:
          RAUFIXTEAM_KEYSTORE_PASSWORD: ${{ secrets.RAUFIXTEAM_KEYSTORE_PASSWORD }}
          RAUFIXTEAM_KEY_ALIAS: ${{ secrets.RAUFIXTEAM_KEY_ALIAS }}
          RAUFIXTEAM_KEY_PASSWORD: ${{ secrets.RAUFIXTEAM_KEY_PASSWORD }}
        run: ./gradlew :app_mojo:assembleFullRelease

      - name: Wipe temporary keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raufixteam-launcher-signed-apk
          path: app_mojo/build/outputs/apk/full/release/*.apk
          retention-days: 30
